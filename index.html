const $=id=>document.getElementById(id);let starOnly=false;

function render(){let q=$('q').value.trim().toLowerCase(), a=+$('from').value||1,b=+$('to').value||2500; if(a>b)[a,b]=[b,a];
 let hideWord=$('hideWord').checked, hideMeaning=$('hideMeaning').checked, hideExample=$('hideExample').checked;
 let list=WORDS.filter(x=>x.n>=a&&x.n<=b&&(!starOnly||x.s)&&(!q||(x.w+' '+x.m+' '+x.e).toLowerCase().includes(q)));
 $('stats').textContent=`${list.length}語を表示中（全${WORDS.length}語）${starOnly?'・⭐重要語のみ':''}`;
 $('grid').innerHTML=list.map(x=>`<article class="card"><div class="top"><div><div class="num">No.${x.n}</div><div class="word">${x.s?'<span class="star">★</span> ':''}${hideWord?mask(x.w):esc(x.w)} <button type="button" class="speak-btn card-speak" aria-label="英単語を読み上げ" onclick="event.stopPropagation();habatanSpeak(${JSON.stringify(x.w)},'en-US')">🔊</button></div></div><span class="pos">${esc(x.p)}</span></div><div class="meaning"><span class="label">意味</span>${hideMeaning?mask(x.m):esc(x.m)} <button type="button" class="speak-btn card-speak" aria-label="日本語を読み上げ" onclick="event.stopPropagation();habatanSpeak(${JSON.stringify(x.m)},'ja-JP')">🔊</button></div><div class="example"><span class="label">例文</span>${(hideExample||hideWord)?mask(hideWord?'英単語を隠しているため例文も非表示中':x.e):esc(x.e)} <button type="button" class="speak-btn card-speak" aria-label="例文を読み上げ" onclick="event.stopPropagation();habatanSpeak(${JSON.stringify(x.e)},'en-US')">🔊</button></div></article>`).join('');}

<script>
(function(){
  const toggle=document.getElementById('darkToggle');
  if(toggle){
    const saved=localStorage.getItem('habatan-dark')==='1';
    if(saved){document.documentElement.classList.add('dark');toggle.checked=true;}
    toggle.addEventListener('change',()=>{document.documentElement.classList.toggle('dark',toggle.checked);localStorage.setItem('habatan-dark',toggle.checked?'1':'0');});
  }
  const $=id=>document.getElementById(id);
  const start=$('startQuiz'), reverse=$('startQuizReverse'), retry=$('retryWrong'), review=$('reviewWrong');
  const progress=$('quizProgress'), area=$('quizArea'), reviewArea=$('reviewArea');
  if(!start||!reverse||!retry||!review||!progress||!area||!reviewArea) return;
  let current=[], wrong=[], qi=0, score=0, direction='en-ja';

  const shuffle=arr=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // 音声読み上げ：Safari/Chromeの端末内音声を使う。iPhoneではボタンをタップした直後に再生する。
  function speak(text,lang){
    if(!('speechSynthesis' in window)){ alert('このブラウザは音声読み上げに対応していません。'); return; }
    try{
      window.speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(String(text));
      u.lang=lang||'en-US';
      u.rate=0.9;
      u.pitch=1;
      window.speechSynthesis.speak(u);
    }catch(e){ console.warn('speech error',e); }
  }
  window.habatanSpeak=speak;

  // 日本語→英語用：正解に似た「スペル違い」の候補を作る。
  function misspell(word,seed){
    const base=String(word);
    const tokens=base.split(/(\s+)/);
    const idxs=[];
    tokens.forEach((tok,i)=>{if(/[A-Za-z]/.test(tok)) idxs.push(i);});
    let ti=idxs.length?idxs[seed%idxs.length]:-1;
    if(ti<0) return base+'s';
    let s=tokens[ti];
    const letters=[...s];
    const alphaPos=[];letters.forEach((c,i)=>{if(/[A-Za-z]/.test(c))alphaPos.push(i);});
    if(!alphaPos.length) return base+'s';
    const pos=alphaPos[seed%alphaPos.length];
    const mode=seed%3;
    if(mode===0 && alphaPos.length>=2){
      const pos2=alphaPos[(alphaPos.indexOf(pos)+1)%alphaPos.length];
      [letters[pos],letters[pos2]]=[letters[pos2],letters[pos]];
    }else if(mode===1){
      const c=letters[pos];
      const lower=c.toLowerCase();
      const map={a:'s',b:'v',c:'v',d:'f',e:'w',f:'g',g:'h',h:'j',i:'o',j:'k',k:'l',l:'k',m:'n',n:'m',o:'p',p:'o',q:'w',r:'t',s:'a',t:'y',u:'i',v:'b',w:'e',x:'c',y:'u',z:'x'};
      const nc=map[lower]||'x';
      letters[pos]=c===c.toUpperCase()?nc.toUpperCase():nc;
    }else{
      letters.splice(pos,1);
      if(letters.length===0) letters.push('x');
    }
    tokens[ti]=letters.join('');
    const out=tokens.join('');
    return out===base?base+'s':out;
  }
  function spellingChoices(correct){
    const set=[];
    for(let seed=0;set.length<3 && seed<20;seed++){
      const v=misspell(correct,seed);
      if(v!==correct && !set.includes(v)) set.push(v);
    }
    // 極端に短い語などで候補が作れない時の保険
    let n=0;
    while(set.length<3){
      const v=correct+(n===0?'s':n===1?'ed':'ing');
      if(v!==correct && !set.includes(v)) set.push(v); n++;
    }
    return set;
  }

  function poolForSettings(){
    const a=Number($('from')?.value)||1,b=Number($('to')?.value)||WORDS.length,q=($('q')?.value||'').trim().toLowerCase();
    return WORDS.filter(x=>x.n>=Math.min(a,b)&&x.n<=Math.max(a,b)&&(!window.starOnly||x.s)&&(!q||(x.w+' '+x.m+' '+x.e).toLowerCase().includes(q)));
  }
  function syncButtons(){const has=wrong.length>0;retry.disabled=!has;review.disabled=!has;}
  function startQuiz(items,dir,label){
    direction=dir; current=shuffle(items.length?items:WORDS).slice(0,Math.min(10,items.length||WORDS.length)); wrong=[];qi=0;score=0;reviewArea.innerHTML='';syncButtons();
    if(!current.length){progress.textContent='';area.innerHTML='<div class="quiz-card">問題を作れる単語がありません。</div>';return;}
    showQuestion(label);
    area.scrollIntoView({behavior:'smooth',block:'start'});
  }
  function showQuestion(label){
    if(qi>=current.length){
      progress.textContent='テスト終了';
      area.innerHTML='<div class="quiz-card"><div class="quiz-result">🎉 '+score+' / '+current.length+' 問正解</div><div>'+(wrong.length?'❌ 間違えた問題は「📖 間違いを復習」で確認できます。':'🏆 全問正解！')+'</div></div>';
      syncButtons();if(wrong.length)showReview(false);return;
    }
    const q=current[qi];
    let opts;
    if(direction==='en-ja'){
      const distractors=shuffle(WORDS.filter(x=>x.n!==q.n)).slice(0,3);
      opts=shuffle([q,...distractors]);
      progress.textContent=label+'：問題 '+(qi+1)+' / '+current.length;
      area.innerHTML='<div class="quiz-card"><div>この英単語の日本語訳は？</div><div class="quiz-word">'+esc(q.w)+' <button type="button" class="speak-btn" aria-label="英単語を読み上げ" data-speak="'+esc(q.w)+'" data-lang="en-US">🔊</button></div><div class="quiz-options">'+opts.map((x,i)=>'<button type="button" class="quiz-option" data-i="'+i+'">'+esc(x.m)+'</button>').join('')+'</div></div>';
    }else{
      const misspellings=spellingChoices(q.w);
      opts=shuffle([q,{n:-1,w:misspellings[0],m:'',e:''},{n:-2,w:misspellings[1],m:'',e:''},{n:-3,w:misspellings[2],m:'',e:''}]);
      progress.textContent=label+'：問題 '+(qi+1)+' / '+current.length;
      area.innerHTML='<div class="quiz-card"><div>この日本語に合う英単語は？</div><div class="quiz-word">'+esc(q.m)+' <button type="button" class="speak-btn" aria-label="日本語を読み上げ" data-speak="'+esc(q.m)+'" data-lang="ja-JP">🔊</button></div><div class="quiz-options">'+opts.map((x,i)=>'<button type="button" class="quiz-option" data-i="'+i+'">'+esc(x.w)+'</button>').join('')+'</div><div class="quiz-hint">💡 正解と似たスペルのひっかけ問題です</div></div>';
    }
    area.querySelectorAll('[data-speak]').forEach(btn=>btn.addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();speak(btn.dataset.speak,btn.dataset.lang);}));
    area.querySelectorAll('.quiz-option').forEach(btn=>{
      const handler=ev=>{ev.preventDefault();ev.stopPropagation();answer(btn,opts,q,label);};
      btn.addEventListener('click',handler,{passive:false});
      btn.addEventListener('touchend',handler,{passive:false});
      btn.addEventListener('pointerup',handler,{passive:false});
    });
  }
  function answer(btn,opts,q,label){
    if(btn.dataset.done==='1')return;btn.dataset.done='1';
    area.querySelectorAll('.quiz-option').forEach(b=>b.disabled=true);
    const chosen=opts[Number(btn.dataset.i)],correct=(direction==='en-ja'?chosen.n===q.n:chosen.w===q.w);
    if(correct){btn.classList.add('correct');score++;}
    else{
      btn.classList.add('wrong');if(!wrong.some(x=>x.n===q.n))wrong.push(q);
      area.querySelectorAll('.quiz-option').forEach(b=>{if(b.textContent=== (direction==='en-ja'?q.m:q.w))b.classList.add('correct');});
    }
    syncButtons();setTimeout(()=>{qi++;showQuestion(label);},350);
  }
  function showReview(scroll){
    reviewArea.innerHTML=wrong.length?'<div class="review-area"><div class="review-title">📖 間違えた問題の復習（'+wrong.length+'問）</div>'+wrong.map(x=>'<div class="review-card"><div class="review-word">No.'+x.n+'　'+esc(x.w)+' <button type="button" class="speak-btn" aria-label="英単語を読み上げ" data-speak="'+esc(x.w)+'" data-lang="en-US">🔊</button></div><div class="review-meaning"><strong>意味：</strong>'+esc(x.m)+' <button type="button" class="speak-btn" aria-label="日本語を読み上げ" data-speak="'+esc(x.m)+'" data-lang="ja-JP">🔊</button></div><div class="review-example"><strong>例文：</strong>'+esc(x.e)+' <button type="button" class="speak-btn" aria-label="例文を読み上げ" data-speak="'+esc(x.e)+'" data-lang="en-US">🔊</button></div></div>').join('')+'</div>':'<div class="review-area"><div class="review-title">📖 復習</div><div>まだ間違えた問題はありません。</div></div>';
    reviewArea.querySelectorAll('[data-speak]').forEach(btn=>btn.addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();speak(btn.dataset.speak,btn.dataset.lang);}));

  }
  const guard=new WeakMap();
  function bind(el,fn){
    const run=()=>{if(guard.get(el))return;guard.set(el,true);try{fn();}finally{setTimeout(()=>guard.set(el,false),500);}};
    el.onclick=run;el.ontouchend=()=>run();el.onpointerup=()=>run();
  }
  bind(start,()=>startQuiz(poolForSettings(),'en-ja','英語→日本語 10問'));
  bind(reverse,()=>startQuiz(poolForSettings(),'ja-en','日本語→英語 10問'));
  bind(review,()=>showReview(true));
  bind(retry,()=>{const set=wrong.slice();if(set.length)startQuiz(set,direction,direction==='en-ja'?'間違い再テスト（英語→日本語）':'間違い再テスト（日本語→英語）');});
})();
</script>
